<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">50 Hz planning and 1 kHz Servo releases</title><desc id="desc">Planner releases are shown at zero, twenty and forty milliseconds. Servo executes every millisecond. A new preview is adopted after deferred work becomes available; its arrival is not depicted here.</desc><defs><marker id="086958" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086958"/></marker><marker id="2866a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2866a2"/></marker><marker id="a76327" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a76327"/></marker></defs><rect width="900" height="400" fill="#fafbf8"/><g font-family="sans-serif"><text x="28" y="35" font-size="17" fill="#086958" text-anchor="start" font-weight="650">ONE PLANNER PERIOD CONTAINS 20 SERVO TICKS</text><text x="28" y="72" font-size="17" fill="#172e2c" text-anchor="start" font-weight="400">Illustration of scheduled releases; worker completion is asynchronous.</text><text x="28" y="143" font-size="19" fill="#086958" text-anchor="start" font-weight="600">Planner · 50 Hz</text><text x="28" y="244" font-size="19" fill="#2866a2" text-anchor="start" font-weight="600">Servo · 1 kHz</text><path d="M 225 110 V 270" stroke="#cad5cf" stroke-dasharray="5 5"/><path d="M 225 122 l 10 16 l -10 16 l -10 -16 z" fill="#086958"/><text x="225" y="297" font-size="17" fill="#172e2c" text-anchor="middle" font-weight="400">0 ms</text><circle cx="225" cy="238" r="4" fill="#2866a2"/><circle cx="240" cy="238" r="4" fill="#2866a2"/><circle cx="255" cy="238" r="4" fill="#2866a2"/><circle cx="270" cy="238" r="4" fill="#2866a2"/><circle cx="285" cy="238" r="4" fill="#2866a2"/><circle cx="300" cy="238" r="4" fill="#2866a2"/><circle cx="315" cy="238" r="4" fill="#2866a2"/><circle cx="330" cy="238" r="4" fill="#2866a2"/><circle cx="345" cy="238" r="4" fill="#2866a2"/><circle cx="360" cy="238" r="4" fill="#2866a2"/><circle cx="375" cy="238" r="4" fill="#2866a2"/><circle cx="390" cy="238" r="4" fill="#2866a2"/><circle cx="405" cy="238" r="4" fill="#2866a2"/><circle cx="420" cy="238" r="4" fill="#2866a2"/><circle cx="435" cy="238" r="4" fill="#2866a2"/><circle cx="450" cy="238" r="4" fill="#2866a2"/><circle cx="465" cy="238" r="4" fill="#2866a2"/><circle cx="480" cy="238" r="4" fill="#2866a2"/><circle cx="495" cy="238" r="4" fill="#2866a2"/><circle cx="510" cy="238" r="4" fill="#2866a2"/><path d="M 525 110 V 270" stroke="#cad5cf" stroke-dasharray="5 5"/><path d="M 525 122 l 10 16 l -10 16 l -10 -16 z" fill="#086958"/><text x="525" y="297" font-size="17" fill="#172e2c" text-anchor="middle" font-weight="400">20 ms</text><circle cx="525" cy="238" r="4" fill="#2866a2"/><circle cx="540" cy="238" r="4" fill="#2866a2"/><circle cx="555" cy="238" r="4" fill="#2866a2"/><circle cx="570" cy="238" r="4" fill="#2866a2"/><circle cx="585" cy="238" r="4" fill="#2866a2"/><circle cx="600" cy="238" r="4" fill="#2866a2"/><circle cx="615" cy="238" r="4" fill="#2866a2"/><circle cx="630" cy="238" r="4" fill="#2866a2"/><circle cx="645" cy="238" r="4" fill="#2866a2"/><circle cx="660" cy="238" r="4" fill="#2866a2"/><circle cx="675" cy="238" r="4" fill="#2866a2"/><circle cx="690" cy="238" r="4" fill="#2866a2"/><circle cx="705" cy="238" r="4" fill="#2866a2"/><circle cx="720" cy="238" r="4" fill="#2866a2"/><circle cx="735" cy="238" r="4" fill="#2866a2"/><circle cx="750" cy="238" r="4" fill="#2866a2"/><circle cx="765" cy="238" r="4" fill="#2866a2"/><circle cx="780" cy="238" r="4" fill="#2866a2"/><circle cx="795" cy="238" r="4" fill="#2866a2"/><circle cx="810" cy="238" r="4" fill="#2866a2"/><path d="M 825 110 V 270" stroke="#cad5cf" stroke-dasharray="5 5"/><path d="M 825 122 l 10 16 l -10 16 l -10 -16 z" fill="#086958"/><text x="825" y="297" font-size="17" fill="#172e2c" text-anchor="middle" font-weight="400">40 ms</text><circle cx="825" cy="238" r="4" fill="#2866a2"/><path d="M 225 177 V 185 H 525 V 177" fill="none" stroke="#086958" stroke-width="2"/><text x="375.0" y="208" font-size="16" fill="#086958" text-anchor="middle" font-weight="400">20 ms between releases</text><text x="28" y="345" font-size="17" fill="#172e2c" text-anchor="start" font-weight="400">Between releases: sample the installed trajectory, use fresh state, compute torque.</text><text x="28" y="376" font-size="16" fill="#172e2c" text-anchor="start" font-weight="400">The dots are schedule ticks, not measured execution durations or deadline guarantees.</text></g></svg>
