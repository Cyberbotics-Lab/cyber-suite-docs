<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" role="img" aria-labelledby="title desc"><title id="title">Digit&#x27;s model-based control loop</title><desc id="desc">A desired motion enters Servo. Servo sends command, estimated state and contact history to the planner. The planner returns task references. Servo sends actuator commands to the Plant, and the Plant returns sensor readings. CORTA coordinates the systems.</desc><defs><marker id="086958" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#086958"/></marker><marker id="2866a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2866a2"/></marker><marker id="a76327" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a76327"/></marker></defs><rect width="900" height="572" fill="#fafbf8"/><g font-family="sans-serif"><text x="28" y="35" font-size="17" fill="#086958" text-anchor="start" font-weight="650">ONE COMMAND, TWO FEEDBACK LOOPS</text><rect x="16" y="212" width="868" height="295" rx="16" fill="#edf4ed"/><rect x="332" y="65" width="240" height="96" rx="12" fill="#fff" stroke="#086958" stroke-width="2"/><text x="350" y="97" font-size="21" fill="#086958" text-anchor="start" font-weight="650">Desired motion</text><text x="350" y="126" font-size="16" fill="#172e2c" text-anchor="start" font-weight="400">Scenario or live operator</text><path d="M 452 161 V 255" fill="none" stroke="#086958" stroke-width="2.5" marker-end="url(#086958)"/><text x="466" y="194" font-size="15" fill="#172e2c" text-anchor="start" font-weight="400">e.g. forward 0.3 m/s</text><rect x="35" y="255" width="230" height="125" rx="12" fill="#fff" stroke="#086958" stroke-width="2"/><text x="53" y="287" font-size="21" fill="#086958" text-anchor="start" font-weight="650">Planner · 50 Hz</text><text x="53" y="316" font-size="16" fill="#172e2c" text-anchor="start" font-weight="400">ALIP or DCM</text><text x="53" y="340" font-size="16" fill="#172e2c" text-anchor="start" font-weight="400">Choose steps + references</text><rect x="332" y="255" width="240" height="125" rx="12" fill="#fff" stroke="#086958" stroke-width="2"/><text x="350" y="287" font-size="21" fill="#086958" text-anchor="start" font-weight="650">Servo · 1 kHz</text><text x="350" y="316" font-size="16" fill="#172e2c" text-anchor="start" font-weight="400">Estimate state</text><text x="350" y="340" font-size="16" fill="#172e2c" text-anchor="start" font-weight="400">Track tasks with TAC-QP</text><rect x="638" y="255" width="230" height="125" rx="12" fill="#fff" stroke="#086958" stroke-width="2"/><text x="656" y="287" font-size="21" fill="#086958" text-anchor="start" font-weight="650">Plant</text><text x="656" y="316" font-size="16" fill="#172e2c" text-anchor="start" font-weight="400">MuJoCo or LLAPI</text><text x="656" y="340" font-size="16" fill="#172e2c" text-anchor="start" font-weight="400">Apply command + observe</text><path d="M 265 280 H 332" fill="none" stroke="#086958" stroke-width="2.5" marker-end="url(#086958)"/><text x="286" y="242" font-size="15" fill="#086958" text-anchor="middle" font-weight="400">references</text><path d="M 572 280 H 638" fill="none" stroke="#086958" stroke-width="2.5" marker-end="url(#086958)"/><text x="658" y="242" font-size="15" fill="#086958" text-anchor="middle" font-weight="400">actuator command</text><path d="M 638 348 H 572" fill="none" stroke="#2866a2" stroke-width="2.5" marker-end="url(#2866a2)"/><text x="688" y="408" font-size="15" fill="#2866a2" text-anchor="middle" font-weight="400">sensor readings</text><path d="M 332 348 H 265" fill="none" stroke="#2866a2" stroke-width="2.5" marker-end="url(#2866a2)"/><text x="182" y="408" font-size="14" fill="#2866a2" text-anchor="middle" font-weight="400">command + estimated state + contact history</text><text x="40" y="458" font-size="18" fill="#172e2c" text-anchor="start" font-weight="600">Fast loop: Servo ↔ Plant</text><text x="40" y="487" font-size="18" fill="#172e2c" text-anchor="start" font-weight="600">Planning loop: Servo ↔ Planner</text><text x="525" y="458" font-size="17" fill="#086958" text-anchor="start" font-weight="400">CORTA schedules work and</text><text x="525" y="483" font-size="17" fill="#086958" text-anchor="start" font-weight="400">carries bounded messages.</text><text x="28" y="546" font-size="17" fill="#172e2c" text-anchor="start" font-weight="400">Arrows show information flow. Logs and viewers observe these systems.</text></g></svg>
